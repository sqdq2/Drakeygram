name: Drakeygram Linux build

# Manual only. Heavy third-party libraries are built in parallel jobs (one
# runner each, so each gets its own 6 hour limit) and cached in the GitHub
# container registry. The last job assembles the build image from those caches
# and compiles Drakeygram.
on:
  workflow_dispatch:
    inputs:
      compile:
        description: "Compile Drakeygram after the libraries are built."
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/drakeygram-cache

jobs:
  libs:
    name: Library ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        target: [qt, webrtc, ffmpeg]
    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate Dockerfile.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }}.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          target: ${{ matrix.target }}
          cache-from: type=registry,ref=${{ env.CACHE_REPO }}:${{ matrix.target }}
          cache-to: type=registry,ref=${{ env.CACHE_REPO }}:${{ matrix.target }},mode=max,image-manifest=true,oci-mediatypes=true

  build:
    name: Build Drakeygram
    needs: libs
    if: ${{ inputs.compile }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      IMAGE_TAG: drakeygram:env
    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.drakeygram-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the build image from the library caches.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_REPO }}:qt
            type=registry,ref=${{ env.CACHE_REPO }}:webrtc
            type=registry,ref=${{ env.CACHE_REPO }}:ffmpeg
            type=registry,ref=${{ env.CACHE_REPO }}:all
          cache-to: type=registry,ref=${{ env.CACHE_REPO }}:all,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Restore ccache.
        id: cache-tdesktop
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-drakeygram-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-drakeygram-

      # The test api_id only makes the compile check possible. A real build
      # must use your own credentials (see README.md).
      - name: Compile Drakeygram.
        run: |
          ccache -z
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Debug \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Save ccache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        run: |
          filePath="out/Debug/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done."
            stat -c 'File size of %n: %s bytes' "$filePath"
          else
            echo "Build error, output file does not exist."
            exit 1
          fi
